plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'io.freefair.lombok' version '9.5.0'
    id 'com.hypherionmc.modutils.modpublisher' version '2.2.2'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version + "+" + mc_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    withJavadocJar()
}

neoForge {
    version = project.neo_version

    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    exclude '.cache/'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // JEI
        url "https://maven.blamejared.com/"
    }
    maven {
        url "https://api.modrinth.com/maven"
    }
}

dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-26.1.2-neoforge:${jei_version}"

    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    compileOnly "curse.maven:geore-530544:8288343"
    localRuntime "curse.maven:geore-530544:8288343"

    compileOnly "curse.maven:ex-pattern-provider-892005:8698967"
    localRuntime "curse.maven:ex-pattern-provider-892005:8698967"

    compileOnly "curse.maven:just-dire-things-1002348:8251776"
    localRuntime "curse.maven:just-dire-things-1002348:8251776"

    localRuntime "org.appliedenergistics:guideme:${guideme_version}"
    localRuntime "curse.maven:glodium-957920:8196173"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            mc_version      : mc_version,
            mc_version_range: mc_version_range,
            neo_version     : neo_version,
            mod_id          : mod_id,
            mod_name        : mod_name,
            mod_license     : mod_license,
            mod_version     : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            groupId = project.mod_group_id
            artifactId = project.mod_id
            version = project.version
        }
    }
    repositories {
        maven {
            name = 'reposilite'

            def isSnapshot = project.version.toString().endsWith('-SNAPSHOT')
            def repoUrl = isSnapshot ? 'https://maven.satherov.dev/snapshots' : 'https://maven.satherov.dev/releases'

            url = uri(repoUrl)

            credentials {
                username = System.getenv('REPOSILITE_USERNAME')
                password = System.getenv('REPOSILITE_TOKEN')
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

publisher {
    setCurseID("1316818")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
